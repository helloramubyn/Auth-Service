name: Auth-Service CI/CD
run-name: Deploy to ${{ inputs.environment }} | by ${{ github.actor }} | branch ${{github.ref_name}}
on: 
 workflow_dispatch:
  inputs:
   environments:
     description: "Environment to deploy"
     type: choice
     options:
          - dev
          - test
          - stage
          - prod 
     default: dev 
env:
  DOCKER_IMAGE_NAME: bynramu/helpdeskportal-auth
  GCP_PROJECT_ID: project-end-to-end
  GKE_CLUSTER: helpdesk-cluster
  GKE_ZONE: us-central1-a
jobs:
#---- Job 1 - Build and Test ----#
  build-and-test:
      name: Build and Test
      runs-on: ubuntu-latest
      steps:
       - name: Check out code
         uses: actions/checkout@v4
       - name: Set up Java
         uses: actions/setup-java@v6
         with:
            java-version: '17'
            distribution: temurin
            cache: maven
#---- Job 2 - Sonar Scan----#
#---- Job 3 - Docker - Build and Push  ----#
  docker-build-and-push:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
     image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Docker Image Tag
        id: tag
        run: echo "value=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}     
      - name: Build and Push Image  
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
                ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.tag.outputs.value }}

#---- Job 4 - Deploy----#
  deploy-to-dev:
    name: Deploy to ${{ inputs.environment }} 
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    env:
      name: dev
      NAMESPACE: projecthelpdesk-${{ inputs.environment }} 
      SECRET_NAME: i27-auth-${{ inputs.environment }} 
    environment: 
      name: ${{ inputs.environment}}  
    permissions: 
      contents: read
      id-token: write # required for OIDC token google-github-actions/auth exchanged to gcp credentials
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Authenticate to GCP via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER}}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{env.GCP_PROJECT_ID}}
      - name: Get GKE Credentials
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: ${{ env.GKE_CLUSTER}}
          location: ${{ env.GKE_ZONE }}    
      - name: Nodes list
        run: |
          kubectl get nodes    
      - name: Set the image tag
        run: | 
          IMAGE="${{ env.DOCKER_IMAGE_NAME}}:${{ needs.docker-build-and-push.outputs.image-tag}}"
          sed -i "s|\${IMAGE}|${IMAGE}|g" k8s/deployment.yaml
          sed -i "s|\${SECRET_NAME}|${{ env.SECRET_NAME}}|g" k8s/deployment.yaml   
      - name: Deploy the manifests
        run: |
          kubectl apply -n ${{ env.NAMESPACE }} -f k8s/deployment.yaml
          kubectl apply -n ${{ env.NAMESPACE }} -f k8s/service.yaml  
      - name: Verify Rollout 
        run: |
          kubectl rollout status deployment/i27-auth -n ${{ env.NAMESPACE }} --timeout=120s    


       
      

#---- Job 5 - Deploy to Stage ----#
#---- Job 6 - Deploy to Prod ----#