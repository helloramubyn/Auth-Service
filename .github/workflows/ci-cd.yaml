name: Auth-Service CI/CD
on: 
  push: 
     branches: [main]
     path:
       - 'pom.xml'
       - 'Dockerfile'
       - 'src/**'
  workflow_dispatch:
env:
  DOCEKR_IMAGE_NAME: bynramu/helpdeskportal-auth
jobs:
#---- Job 1 - Build and Test ----#
  build-and-test:
      name: Build and Test
      runs-on: ubuntu-latest
      steps:
       - name: Check out code
         uses: actions/checkout@v4
       - name: Set up Java
         uses: actions/setup-java@v6
         with:
            java-version: '17'
            distribution: temurin
            cache: maven
#---- Job 2 - Sonar Scan----#
#---- Job 3 - Docker - Build and Push  ----#
  docker-build-and-push:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
     image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Docker Image Tag
        id: tag
        run: echo "value=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}     
      - name: Build and Push Image  
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.tag.outputs.value }}

#---- Job 4 - Deploy to Dev ----#
#---- Job 5 - Deploy to Stage ----#
#---- Job 6 - Deploy to Prod ----#